# ------------------------------------------------------------
# Contraintes transporteurs
# ------------------------------------------------------------

GLOBAL:
  rounding_10kg: true

XPO:
  enabled: true
  palette_parfaite_required: true
  fixed_fee_eur: 3.00

  # Formats acceptés (cm)
  allowed_formats_cm:
    - [80, 120]
    - [60, 80]
    - [100, 120]

  # Hauteur maximum (cm)
  max_height_cm: 220

  # Poids maximum par palette complète (kg)
  max_weight_full_pallet_kg: 1000

  # Demi palette (si 1 seule palette)
  half_pallet:
    enabled: true
    max_weight_kg: 200
    only_if_single_palette: true

  # Règle de facturation : si plusieurs palettes => pas de demi palette
  billing:
    no_half_when_multiple: true

GEODIS:
  split_100kg: true
  rounding_10kg: true

  limits:
    max_weight_total_kg: 1000
    max_length_m: 4.0
    max_height_m: 2.0

DACHSER:
  enabled: true
  zone_difficile_fee_eur: 0.00     # ✅ supplément zone difficile  
  fixed_fee_eur: 3.98              # ✅ supplément fixe par expédition
  split_100kg: true
  rounding_10kg: true
  limits:
    max_weight_per_pallet_kg: 1500
    max_length_m: 2.4
    max_width_m: 1.8
    max_height_m: 2.2
  multi_trip_dept:
    "20": ["13", "20"]

KUEHNE:
  enabled: false             # ✅ désactivé
  split_100kg: true
  rounding_10kg: true
  limits:
    max_total_weight_kg: 1500
